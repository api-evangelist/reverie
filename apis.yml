name: Reverie
description: 'Reverie is an early-stage venture capital firm based in New York that invests
  at the pre-seed and seed stages in crypto and web3 companies and protocols, describing
  its work as crafting generational companies and protocols. Its portfolio spans blockchain
  infrastructure, wallets and key management, DeFi, on-chain security, and trading, and
  includes companies such as Blockaid, Keplr, Squads, Stride, Tensor, Geodnet, and Agora.
  Reverie was surfaced through the Multicoin Capital portfolio and also produces The Archive
  podcast. It is an investment firm rather than an API producer, so it publishes no public
  API, SDKs, or developer documentation.'
